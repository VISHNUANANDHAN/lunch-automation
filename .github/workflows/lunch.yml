name: Lunch Automation

on:
  schedule:
    - cron: '30 23 * * 0-5'

  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install pandas playwright
          playwright install

      - name: Run automation
        run: python automation.py
